name: Actual project templates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true
env:
  MCPP_VERSION: "2026.10.24.1"
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.mcpp/registry
          key: template-registry-${{ github.repository }}-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            template-registry-${{ github.repository }}-${{ env.MCPP_VERSION }}-
      - name: Install current mcpp
        shell: bash
        run: |
          archive="mcpp-${MCPP_VERSION}-linux-x86_64.tar.gz"
          curl -L -fsS -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/$archive"
          tar -xzf "$archive"
          root="$PWD/mcpp-${MCPP_VERSION}-linux-x86_64"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Install toolchains
        run: |
          mcpp toolchain install gcc 16.1.0
          mcpp toolchain install llvm 23.1.3
      - uses: actions/checkout@v4
        with:
          repository: mcpplibs/mcpp-index
          ref: f0f8e48c396dad2ac67315f2ac54a197772e6555
          path: .candidate-index
      - name: Actual default scaffold without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY python3 tools/test_template.py --toolchain llvm@23.1.3 --index .candidate-index
      - name: Virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Actual window and docking scaffolds render three frames
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a python3 tools/test_template.py --template window --toolchain llvm@23.1.3 --run-arg=--smoke-test --index .candidate-index
          xvfb-run -a python3 tools/test_template.py --template docking --toolchain llvm@23.1.3 --run-arg=--smoke-test --index .candidate-index
